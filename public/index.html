<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticação</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🔐 Sistema de Autenticação</h1>
                <p>Bem-vindo! Faça login ou crie uma conta.</p>
            </div>
            
            <div class="button-group">
                <a href="login.html" class="btn btn-primary">
                    <span>🔑</span> Fazer Login
                </a>
                <a href="register.html" class="btn btn-secondary">
                    <span>✨</span> Criar Conta
                </a>
            </div>

            <div class="features">
                <h3>Recursos do Sistema:</h3>
                <ul>
                    <li>✅ Registro de usuários com validação</li>
                    <li>✅ Login seguro com JWT</li>
                    <li>✅ Área protegida por autenticação</li>
                    <li>✅ Logout automático ao sair</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
